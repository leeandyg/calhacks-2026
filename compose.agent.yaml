services:
  world-agent:
    build: ./worker
    init: true
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in .env for model inference}
      WORLD_AGENT_API_KEY: ${WORLD_AGENT_API_KEY:?Set WORLD_AGENT_API_KEY in .env}
      WORLD_AGENT_MODEL: ${WORLD_AGENT_MODEL:-claude-opus-5-5}
    volumes:
      - world-agent-data:/data
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 4g
    cpus: 2
    pids_limit: 256
volumes:
  world-agent-data:
